<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuietSignal Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Loading Screen (Web Only) -->
<div id="loadingScreen">
  <h1>QuietSignal</h1>
</div>

<!-- Burger Menu -->
<button id="menuToggle">☰</button>

<nav id="sideMenu">
  <h3>Menu</h3>

  <section>
    <h4>Noise History</h4>
    <div id="historyOutput"></div>
  </section>

  <section>
    <h4>System Logs</h4>
    <ul id="logList"></ul>
  </section>

  <section>
    <h4>Preset Options</h4>
    <p>(Editable in future phase)</p>
  </section>
</nav>

<!-- Main Dashboard -->
<main class="dashboard">

  <!-- Camera Placeholder -->
  <section class="camera-container">
    <p>Camera Feed (16:9)</p>
  </section>

  <!-- Status Area -->
  <section class="status-container">
    <div class="noise-value" id="noiseValue">-- dB</div>
    <div class="noise-status" id="noiseStatus">---</div>
    <div class="active-preset" id="activePreset"></div>
  </section>

  <!-- Preset Buttons -->
  <section class="preset-container" id="presetContainer"></section>

</main>

<script src="script.js"></script>
</body>
</html>
