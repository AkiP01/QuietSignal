<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuietSignal Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Loading Screen (Web Only) -->
<div id="loadingScreen">
  <h1>QuietSignal</h1>
</div>

<!-- Burger Menu -->
<button id="menuToggle">☰</button>

<nav id="sideMenu">
<h3>Menu</h3>

<button class="menu-btn" onclick="openModal('historyModal')">
  Noise History
</button>

<button class="menu-btn" onclick="openModal('logModal')">
  System Logs
</button>

<button class="menu-btn" onclick="openModal('presetModal')">
  Preset Options
</button>

</nav>

<!-- Main Dashboard -->
<main class="dashboard">

  <!-- Camera Placeholder -->
  <section class="camera-container">
    <p>Camera Feed (16:9)</p>
  </section>

  <!-- Status Area -->
  <section class="status-container">
    <div class="noise-value" id="noiseValue">-- dB</div>
    <div class="noise-status" id="noiseStatus">---</div>
    <div class="noise-bar">
    <div id="noiseProgress"></div>
    </div>

    <div class="active-preset" id="activePreset"></div>
  </section>

  <!-- Preset Buttons -->
  <section class="preset-container" id="presetContainer"></section>

</main>



<script src="script.js"></script>

<div class="modal" id="presetModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('presetModal')">← Back</button>
    <h2>Create Noise Preset</h2>

    <label>Preset Name</label>
    <input type="text" id="presetName" placeholder="Lecture, Quiz Time..." />

    <label>Noise Threshold (dB)</label>
    <input type="range" id="thresholdSlider" min="40" max="100" value="70" />

    <label>Beep Volume</label>
    <input type="range" min="0" max="100" value="50" />

    <label>Beep Interval (seconds)</label>
    <input type="number" min="1" max="30" value="5" />

    <label>
      <input type="checkbox" checked />
      Enable Visual Alert
    </label>

    <button onclick="addPreset()">Save Preset</button>
  </div>
</div>

<div class="modal" id="historyModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('historyModal')">← Back</button>
    <h2>Noise History</h2>
    <div id="historyTree"></div>
  </div>
</div>

<div class="modal" id="logModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('logModal')">← Back</button>
    <h2>System Logs</h2>
    <div id="logTree"></div>
  </div>
</div>


</body>
</html>
